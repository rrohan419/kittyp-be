spring.application.name=kittyp
server.port=${PORT:8080}
secret.key=${ADMIN_BOOTSTRAP_SECRET:}
app.frontend.base-url=https://kittyp.in

# Spring Datasource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres.railway.internal:5432/railway
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:604800000}

jwt.audience=KITTYP

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
# Never TRACE bind params in shared envs — WhatsApp tokens and passwords would appear in logs.
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

zoho.api.key=${ZOHO_API_KEY}
kittyp.mail.id=noreply@kittyp.in
kittyp.mail.id=noreply@kittyp.in
zoho.mail.base.url=https://api.zeptomail.in/v1.1
zoho.email.send.url.with.template=${zoho.mail.base.url}/email/template
