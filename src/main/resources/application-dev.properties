spring.application.name=kittyp
server.port=${PORT:8080}
secret.key=${ADMIN_BOOTSTRAP_SECRET:}

# Spring Datasource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres.railway.internal:5432/railway
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:604800000}

jwt.audience=KITTYP

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
# Never TRACE bind params in shared envs — WhatsApp tokens and passwords would appear in logs.
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

zoho.api.key=${ZOHO_API_KEY}
kittyp.mail.id=admin@kittyp.in
zoho.mail.base.url=https://api.zeptomail.in/v1.1
zoho.email.send.url.with.template=${zoho.mail.base.url}/email/template
zoho.welcome.template.id=2518b.3393a5309f0a2602.k1.12930630-31f1-11f0-950e-8e9a6c33ddc2.196d69ace13

# aws 
aws.access.key.id=${AWS_ACCESS_KEY_ID}
aws.secret.key=${AWS_SECRET_ACCESS_KEY}
amazon.s3.region=${AWS_S3_REGION}
aws.invoice.bucket.name=${AWS_S3_INVOICE_BUCKET_NAME}
aws.user.bucket.name=${AWS_S3_USERS_BUCKET_NAME}

# Gemini
google.api.key=${GOOGLE_API_KEY}
google.gemini.model=gemini-2.5-flash
google.weather.api.url=https://weather.googleapis.com/v1/currentConditions:lookup?key=%s&location.latitude=%s&location.longitude=%s

firebase.service.account=${FIREBASE_SERVICE_ACCOUNT}

# WhatsApp Cloud API (Meta) — see docs/whatsapp-setup.md
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.invoice-template=${WHATSAPP_INVOICE_TEMPLATE:invoice_receipt}
whatsapp.invoice-template-lang=${WHATSAPP_INVOICE_TEMPLATE_LANG:en}
whatsapp.vaccine-template=${WHATSAPP_VACCINE_TEMPLATE:vaccine_reminder}
whatsapp.checkup-template=${WHATSAPP_CHECKUP_TEMPLATE:checkup_reminder}
whatsapp.promo-template=${WHATSAPP_PROMO_TEMPLATE:promo_offer}
whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}

# AES key material for encrypting WhatsApp tokens at rest (SHA-256 derived)
app.crypto.secret=${APP_CRYPTO_SECRET:${JWT_SECRET:}}