spring.profiles.active=local

# API documentation is disabled in every profile by default (defense-in-depth).
# Prod, dev, and local all keep swagger-ui and api-docs off unless explicitly re-enabled.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Public Jitsi Meet host for video consults. Point this at a self-hosted Jitsi to embed in-app.
app.jitsi.base-url=https://meet.jit.si

# Actuator details live on the management port only. Public app port serves status-only /health.
# /health is intentionally public (permitAll in SecurityConfig) because Railway's
# healthcheck probes the public app port; it returns status only, never component detail
# (details are gated to the management port via management.endpoints.web.exposure.include).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,dashboard
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
kittyp.health.load-test.enabled=false

whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.meta.app-id=${WHATSAPP_META_APP_ID:1618807626635540}
whatsapp.meta.app-secret=${WHATSAPP_META_APP_SECRET:}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

sms.base-url=${SMS_BASE_URL:}
sms.username=${SMS_USERNAME:}
sms.password=${SMS_PASSWORD:}

kittyp.security.master-totp-secret=${KITTYP_MASTER_TOTP_SECRET:}

zoho.email.send.url=${zoho.mail.base.url}/email
