spring.profiles.active=local

# Public Jitsi Meet host for video consults. Point this at a self-hosted Jitsi to embed in-app.
app.jitsi.base-url=https://meet.jit.si

# Actuator details live on the management port only. Public app port serves status-only /health.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,dashboard
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
kittyp.health.load-test.enabled=false
