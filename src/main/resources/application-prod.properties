# Production profile — keep secrets in env vars only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Dedicated crypto secret required (EncryptedStringConverter fails fast if missing / JWT fallback).
# APP_CRYPTO_SECRET must be set in the environment.
app.crypto.secret=${APP_CRYPTO_SECRET}

# WhatsApp Cloud API / Embedded Signup — secrets from env only
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.invoice-template=${WHATSAPP_INVOICE_TEMPLATE:invoice_receipt}
whatsapp.invoice-template-lang=${WHATSAPP_INVOICE_TEMPLATE_LANG:en}
whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
whatsapp.meta-app-id=${WHATSAPP_META_APP_ID:}
whatsapp.meta-app-secret=${WHATSAPP_META_APP_SECRET:}
whatsapp.embedded-signup-config-id=${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.register-pin=${WHATSAPP_REGISTER_PIN:}
