# Production profile — keep secrets in env vars only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Lock down actuator in prod: expose status-only health on the management port, no detail,
# and drop the internal HTML dashboard endpoint. The public app port serves only /health.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Dedicated crypto secret required (EncryptedStringConverter fails fast if missing / JWT fallback).
# APP_CRYPTO_SECRET must be set in the environment.
app.crypto.secret=${APP_CRYPTO_SECRET}
